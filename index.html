<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Syllabusलय – CTEVT Diploma in Engineering</title>
<style>
:root{--bg:#f5f8ff;--card:#fff;--ink:#0f1b3d;--mute:#5b6784;--pri:#0a3fc4;--pri2:#0a84ff;--line:#dbe4f7;--ok:#0b8a4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1226;--card:#121c38;--ink:#e8eeff;--mute:#9aa8cc;--pri:#6ea2ff;--pri2:#3d8bff;--line:#223056;--ok:#4cd68a}}
:root[data-theme="dark"]{--bg:#0b1226;--card:#121c38;--ink:#e8eeff;--mute:#9aa8cc;--pri:#6ea2ff;--pri2:#3d8bff;--line:#223056;--ok:#4cd68a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
header img{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none}
header .home-brand{display:flex;align-items:center;gap:12px;flex:1;min-width:120px;color:inherit;text-decoration:none;border-radius:10px;cursor:pointer}
header .home-brand:hover h1{text-decoration:underline;text-decoration-color:var(--pri);text-underline-offset:4px}
header .home-brand:focus-visible{outline:2px solid var(--pri);outline-offset:4px}
header .brand{flex:1;min-width:120px}
h1{font-size:1.35rem;margin:0;line-height:1.2}
header p{margin:2px 0 0;color:var(--mute);font-size:.85rem}
header .top-search{flex:1;min-width:140px;max-width:280px;margin-left:auto}
header .top-search input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.9rem;font-family:inherit}
header .top-search input:focus{outline:none;border-color:var(--pri)}
button.th{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:1.4rem;color:var(--pri)}.stat span{font-size:.8rem;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .3s}
/* search in header .top-search */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs button{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:.9rem}
.progs button{font-weight:600}
.prog-group{margin:10px 0 12px}
.education-toggle{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);margin:10px 0 14px}
.education-toggle>summary{cursor:pointer;list-style:none;font-weight:800;font-size:1.02rem;padding:4px 2px;display:flex;align-items:center;justify-content:flex-start;gap:12px;flex-wrap:wrap}.education-toggle>summary::-webkit-details-marker{display:none}.education-toggle>summary::before{content:"▶";display:inline-block;font-size:.78em;color:var(--pri);transition:transform .18s ease;flex:0 0 auto}.education-toggle[open]>summary::before{transform:rotate(90deg)}.education-toggle>summary .education-search{display:flex;align-items:center;gap:10px;margin-left:auto;padding-left:12px}.education-toggle>summary .search-icon{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:var(--bg);color:var(--pri);font-size:1.1rem;cursor:pointer;display:grid;place-items:center}.education-toggle>summary .search-input-wrap{width:min(170px,38vw)}.education-toggle>summary .search-input-wrap[hidden]{display:none}.education-toggle>summary .search-input-wrap input{width:100%;min-width:0;padding:7px 10px;border-radius:18px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.84rem}.education-toggle>summary .search-input-wrap input:focus{outline:2px solid var(--pri);outline-offset:1px}
.education-toggle-content{padding-top:8px}
.prog-label{font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--mute);margin:0 0 6px 2px;text-transform:uppercase}
.prog-row{display:flex;gap:8px;overflow-x:auto;padding:0 0 6px}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
:root:not([data-theme="light"]) .tabs button.on{color:#06122e}
.sub{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:12px 14px}
.row{display:flex;align-items:flex-start;gap:12px}
.row input{width:20px;height:20px;margin-top:3px;accent-color:var(--pri);flex:none}
.row .t{flex:1;min-width:0}.t strong{display:block}.t small{color:var(--mute)}
.mk{font-weight:600;color:var(--pri);white-space:nowrap}
.done strong{text-decoration:line-through;color:var(--mute)}
details{margin:8px 0 0 32px}summary{cursor:pointer;color:var(--pri);font-size:.88rem}
details ul{margin:6px 0 0;padding-left:18px;color:var(--mute);font-size:.9rem}
.tot{text-align:right;color:var(--mute);font-size:.9rem;margin:4px 2px 14px}
.info{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;color:var(--mute);font-size:.88rem}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;color:var(--mute)}
/* th in header */
body.emb{--bg:#101014;--card:#19191f;--line:#292930;--ink:#f7f7fa;--mute:#92929c;--pri:#25e5dc;--pri2:#ff315b}body.emb .wrap{padding-top:78px}body.emb .tabs button.on{color:#101014}body.emb .th{display:none}

.topics{list-style:none;padding-left:0}
.topics>li{margin:4px 0}
.topics details{margin:2px 0 2px 8px}
.prog-group{margin:10px 0;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.prog-group>summary,.ctevt-faculty-toggle>summary{cursor:pointer;color:var(--pri);font-weight:650;padding:5px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.prog-group>summary{list-style:none}.prog-group>summary::-webkit-details-marker{display:none}.prog-group>summary::before{content:"▶";display:inline-block;flex:0 0 14px;width:14px;font-size:.72em;line-height:1;color:var(--pri);transition:transform .18s ease}.prog-group[open]>summary::before{transform:rotate(90deg)}.prog-group{position:relative;padding-right:42px}.prog-group>.prog-label{display:block;padding-right:4px}.study-places-btn{position:absolute;top:2px;right:2px;margin:0;border:0;border-radius:8px;padding:4px 7px;background:transparent;color:var(--pri);font:inherit;font-size:1.15rem;line-height:1;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}.study-places-btn:hover,.study-places-btn:focus-visible{background:var(--bg);outline:2px solid var(--pri);outline-offset:2px}.study-places-panel{margin:8px 0 12px;padding:12px;border:1px dashed var(--line);border-radius:12px;background:var(--card)}.study-places-panel[hidden]{display:none}.study-places-panel h4{margin:0 0 7px;font-size:.9rem}.study-places-panel p{margin:5px 0;font-size:.82rem;color:var(--mute)}.study-place-links{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.study-place-links a{display:inline-block;padding:6px 10px;border:1px solid var(--line);border-radius:18px;color:var(--pri);text-decoration:none;font-size:.78rem}.study-place-links a:hover{border-color:var(--pri)}
.ctevt-faculty-toggle{margin:6px 0 6px 14px;padding:5px 10px;border-left:2px solid var(--line)}
.topics summary{font-weight:500;color:var(--pri)}
.topics ul{margin:4px 0 6px 12px;padding-left:14px;color:var(--mute);font-size:.88rem}

.papers{margin:8px 0 0 32px;font-size:.88rem}
.papers a{color:var(--pri);text-decoration:none;border-bottom:1px dashed var(--line)}
.papers a:hover{border-bottom-style:solid}
.tlinks{white-space:nowrap;margin-left:4px}
.tlinks a{color:var(--pri);text-decoration:none;font-size:.78rem;margin-left:3px;opacity:.8}
.tlinks a:hover{opacity:1}
.res{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:16px 0;font-size:.9rem;color:var(--mute)}
.res h3{margin:0 0 8px;color:var(--ink);font-size:1rem}
.res ul{margin:6px 0 0;padding-left:18px}
.res li{margin:4px 0}

.university-toggle{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.university-toggle>summary,.university-item>summary{cursor:pointer;font-weight:700;padding:5px 2px}
.university-list{display:grid;gap:10px;margin-top:10px}
.university-item{border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--bg)}
.university-item .prog-row,.university-list>.prog-row{margin-top:8px}
body.intro-only #tabs,body.intro-only #list,body.intro-only #tot{display:none!important}
body.intro-only header{display:flex!important;align-items:center;margin-bottom:18px}
body.intro-only header .top-search,body.intro-only header .th,body.intro-only header #sub{display:none!important}
body.intro-only .wrap{padding-top:20px}

.subject-open{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}.subject-open>summary{cursor:pointer;list-style:none;font-weight:650}.subject-open>summary::-webkit-details-marker{display:none}.subject-open>summary:after{content:"＋";float:right;color:var(--pri)}.subject-open[open]>summary:after{content:"−"}.subject-content{padding-top:10px}.subject-content .row{margin-top:4px}
</style></head><body class="intro-only"><div class="wrap">
